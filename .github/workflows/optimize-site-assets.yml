name: One-time SEO Repair

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/optimize-site-assets.yml'

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore missing helper
        run: |
          cat >> scripts/prepare-seo.mjs <<'EOF'

function escapeRegExp(value) {
  return String(value).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
}
EOF

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run complete build and audits
        run: npm run docs:build

      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/prepare-seo.mjs
          git commit -m "fix: restore SEO regex helper"
          git push origin HEAD:main
