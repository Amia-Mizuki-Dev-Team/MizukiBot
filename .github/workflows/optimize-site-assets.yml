name: One-time Final Site Validation

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/optimize-site-assets.yml'

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Run complete validation
        id: validation
        run: |
          mkdir -p .github/validation
          report=.github/validation/final-site-validation.txt
          : > "$report"

          set +e
          {
            echo "commit=${GITHUB_SHA}"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo
            echo "===== npm ci ====="
            npm ci
            install_status=$?
            echo
            echo "npm_ci_exit=${install_status}"

            if [ "${install_status}" -eq 0 ]; then
              echo
              echo "===== npm run docs:build ====="
              npm run docs:build
              build_status=$?
            else
              build_status=125
              echo "跳过构建：npm ci 失败"
            fi

            echo
            echo "docs_build_exit=${build_status}"
          } >> "$report" 2>&1

          if grep -q '^npm_ci_exit=0$' "$report" && grep -q '^docs_build_exit=0$' "$report"; then
            final_status=0
          else
            final_status=1
          fi

          echo "final_exit=${final_status}" >> "$report"
          echo "status=${final_status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit validation report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/validation/final-site-validation.txt
          git commit -m "test: record final site validation"
          git push origin HEAD:main

      - name: Fail when validation failed
        if: steps.validation.outputs.status != '0'
        run: exit 1
