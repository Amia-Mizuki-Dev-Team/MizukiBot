name: Refresh maintenance lockfile

on:
  push:
    branches:
      - maintenance/node24-deps-20260801
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/refresh-maintenance-lock.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@v6
        with:
          ref: maintenance/node24-deps-20260801

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Regenerate package lock
        run: npm install --package-lock-only

      - name: Commit lockfile update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json

          if git diff --cached --quiet; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi

          git commit -m "chore: refresh package lock"
          git push origin HEAD:maintenance/node24-deps-20260801
