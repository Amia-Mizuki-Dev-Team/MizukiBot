name: Refresh Undici Security Lock

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/refresh-undici-lock.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin patched Undici
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'package.json'
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'))
          pkg.overrides ??= {}
          pkg.overrides.undici = '7.29.0'
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n')
          NODE

      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify clean install
        run: npm ci

      - name: Verify dependency security
        run: npm audit --audit-level=moderate

      - name: Commit patched lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json

          if git diff --cached --quiet; then
            echo "No dependency changes required"
            exit 0
          fi

          git commit -m "fix: update undici to patched 7.29.0"
          git push origin HEAD:main
