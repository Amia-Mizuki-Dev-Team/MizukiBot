name: Fix Transparent Homepage Avatar

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-transparent-avatar.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Remove connected black background
        run: |
          mkdir -p .github/validation
          python <<'PY'
          from collections import deque
          from pathlib import Path
          from PIL import Image

          source = Path('docs/public/Picture/avatar.jpg')
          output = Path('docs/public/Picture/avatar.webp')

          image = Image.open(source).convert('RGBA')
          width, height = image.size
          pixels = image.load()

          # Only remove dark pixels connected to the outer border. This preserves
          # dark eyes, outlines and clothing details enclosed inside the subject.
          visited = bytearray(width * height)
          background = bytearray(width * height)
          queue = deque()

          def index(x, y):
              return y * width + x

          def is_background_candidate(x, y):
              r, g, b, _ = pixels[x, y]
              maximum = max(r, g, b)
              minimum = min(r, g, b)
              luminance = (299 * r + 587 * g + 114 * b) // 1000
              return luminance <= 58 and maximum <= 76 and maximum - minimum <= 32

          def enqueue(x, y):
              i = index(x, y)
              if visited[i] or not is_background_candidate(x, y):
                  return
              visited[i] = 1
              queue.append((x, y))

          for x in range(width):
              enqueue(x, 0)
              enqueue(x, height - 1)
          for y in range(height):
              enqueue(0, y)
              enqueue(width - 1, y)

          while queue:
              x, y = queue.popleft()
              background[index(x, y)] = 1
              for ny in range(max(0, y - 1), min(height, y + 2)):
                  for nx in range(max(0, x - 1), min(width, x + 2)):
                      if nx == x and ny == y:
                          continue
                      enqueue(nx, ny)

          rgba = image.copy()
          out = rgba.load()
          removed = 0
          feathered = 0

          for y in range(height):
              for x in range(width):
                  i = index(x, y)
                  r, g, b, _ = pixels[x, y]
                  if background[i]:
                      out[x, y] = (r, g, b, 0)
                      removed += 1
                      continue

                  # Feather only pixels immediately adjacent to removed background.
                  touches_background = False
                  for ny in range(max(0, y - 1), min(height, y + 2)):
                      for nx in range(max(0, x - 1), min(width, x + 2)):
                          if background[index(nx, ny)]:
                              touches_background = True
                              break
                      if touches_background:
                          break

                  if touches_background:
                      luminance = (299 * r + 587 * g + 114 * b) // 1000
                      if luminance < 105:
                          alpha = max(24, min(255, int((luminance - 45) * 255 / 60)))
                          out[x, y] = (r, g, b, alpha)
                          feathered += 1

          rgba.save(output, 'WEBP', lossless=True, quality=100, method=6)

          alpha = rgba.getchannel('A')
          alpha_min, alpha_max = alpha.getextrema()
          transparent = sum(1 for value in alpha.getdata() if value == 0)
          opaque = sum(1 for value in alpha.getdata() if value == 255)

          if alpha_min != 0 or alpha_max != 255:
              raise SystemExit(f'alpha range invalid: {alpha_min}..{alpha_max}')
          if transparent < width * height * 0.20:
              raise SystemExit(f'too little background removed: {transparent}')
          if opaque < width * height * 0.10:
              raise SystemExit(f'too little opaque subject retained: {opaque}')
          if output.stat().st_size > 300 * 1024:
              raise SystemExit(f'avatar.webp too large: {output.stat().st_size}')

          report = (
              f'source={source}\n'
              f'output={output}\n'
              f'size={width}x{height}\n'
              f'bytes={output.stat().st_size}\n'
              f'alpha_min={alpha_min}\n'
              f'alpha_max={alpha_max}\n'
              f'transparent_pixels={transparent}\n'
              f'opaque_pixels={opaque}\n'
              f'removed_pixels={removed}\n'
              f'feathered_pixels={feathered}\n'
          )
          Path('.github/validation/transparent-avatar.txt').write_text(report, encoding='utf-8')
          print(report)
          PY

      - name: Update homepage and performance checks
        run: |
          python <<'PY'
          from pathlib import Path

          replacements = {
              'docs/.vitepress/theme/index.ts': [
                  ("src: '/Picture/avatar.jpg'", "src: '/Picture/avatar.webp?v=transparent-20260806'"),
              ],
              'scripts/prepare-performance.mjs': [
                  ("const heroImagePath = '/Picture/avatar.jpg'", "const heroImagePath = '/Picture/avatar.webp?v=transparent-20260806'"),
              ],
              'scripts/audit-performance.mjs': [
                  ("const heroImagePath = '/Picture/avatar.jpg'", "const heroImagePath = '/Picture/avatar.webp?v=transparent-20260806'"),
                  ("'Picture/avatar.jpg': 100 * 1024", "'Picture/avatar.webp': 300 * 1024"),
              ],
          }

          for filename, rules in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for before, after in rules:
                  if before not in text:
                      raise SystemExit(f'missing replacement target in {filename}: {before}')
                  text = text.replace(before, after)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Install project dependencies
        run: npm ci

      - name: Run complete build and audits
        run: npm run docs:build

      - name: Verify built transparent asset
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image

          built = Path('docs/.vitepress/dist/Picture/avatar.webp')
          if not built.exists():
              raise SystemExit('built avatar.webp is missing')
          image = Image.open(built).convert('RGBA')
          alpha_min, alpha_max = image.getchannel('A').getextrema()
          if (alpha_min, alpha_max) != (0, 255):
              raise SystemExit(f'built alpha range invalid: {alpha_min}..{alpha_max}')

          with Path('.github/validation/transparent-avatar.txt').open('a', encoding='utf-8') as report:
              report.write('docs_build_exit=0\n')
              report.write(f'built_bytes={built.stat().st_size}\n')
              report.write(f'built_alpha={alpha_min}..{alpha_max}\n')
          PY

      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/public/Picture/avatar.webp \
            docs/.vitepress/theme/index.ts \
            scripts/prepare-performance.mjs \
            scripts/audit-performance.mjs \
            .github/validation/transparent-avatar.txt
          git commit -m "fix: restore transparent homepage avatar"
          git push origin HEAD:main
