name: Refresh Vue Lockfile

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/refresh-vue-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Update Vue and lockfile
        run: |
          npm pkg set devDependencies.vue=3.5.40
          npm install --package-lock-only --ignore-scripts

      - name: Commit dependency update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json

          if git diff --cached --quiet; then
            echo "Vue 和锁文件已经是目标版本"
            exit 0
          fi

          git commit -m "chore: update Vue to 3.5.40"
          git push origin HEAD:main
