name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'avatar.png'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - '.npmrc'
      - 'wrangler.toml'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Ensure FFmpeg is available
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
            exit 0
          fi

          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Generate HD homepage hero
        run: |
          test -s avatar.png
          ffmpeg -hide_banner -loglevel error -y \
            -i avatar.png \
            -vf "scale=1024:1024:flags=lanczos,unsharp=5:5:0.6:5:5:0.0,format=rgba" \
            -c:v libwebp \
            -q:v 92 \
            -compression_level 6 \
            docs/public/Picture/avatar.webp

          dimensions="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 docs/public/Picture/avatar.webp)"
          bytes="$(stat -c '%s' docs/public/Picture/avatar.webp)"
          echo "Homepage hero dimensions: ${dimensions}"
          echo "Homepage hero bytes: ${bytes}"
          test "${dimensions}" = "1024x1024"
          test "${bytes}" -lt 307200

      - name: Sync HD homepage hero back to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/public/Picture/avatar.webp
          if git diff --cached --quiet; then
            echo "HD homepage hero already matches the generated asset."
          else
            git commit -m "chore: sync HD homepage hero"
            git push origin HEAD:main
          fi

      - name: Repair auditable dependency vulnerabilities
        run: |
          npm audit fix --package-lock-only
          npm ci

      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=moderate

      - name: Generate animated WebP logo
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -i docs/public/Picture/logo.gif \
            -vf "scale=128:128:force_original_aspect_ratio=decrease:flags=lanczos,pad=128:128:(ow-iw)/2:(oh-ih)/2:color=0x00000000,format=rgba" \
            -c:v libwebp_anim \
            -lossless 0 \
            -q:v 72 \
            -compression_level 6 \
            -loop 0 \
            -an \
            docs/public/Picture/logo.webp

          grep -a -q 'ANIM' docs/public/Picture/logo.webp
          frames="$(grep -a -o 'ANMF' docs/public/Picture/logo.webp | wc -l | tr -d ' ')"
          bytes="$(stat -c '%s' docs/public/Picture/logo.webp)"

          echo "Animated WebP frames: ${frames}"
          echo "Animated WebP bytes: ${bytes}"
          test "${frames}" -gt 1
          test "${bytes}" -lt 524288

      - name: Build and audit VitePress site
        run: npm run docs:build

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '4.118.0'
          command: >-
            pages deploy docs/.vitepress/dist
            --project-name=mizuki-bot-docs
            --branch=${{ github.ref_name }}
            --commit-dirty=true

      - name: Submit full sitemap to IndexNow
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          INDEXNOW_FORCE_ALL: 'true'
          INDEXNOW_BEFORE_SHA: ${{ github.event.before }}
          INDEXNOW_AFTER_SHA: ${{ github.sha }}
        run: npm run seo:indexnow
