name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'scripts/**'
      - '.github/assets/avatar-home/**'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - '.npmrc'
      - 'wrangler.toml'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Ensure FFmpeg is available
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
            exit 0
          fi

          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Restore homepage hero assets
        run: |
          cat .github/assets/avatar-home/part-*.b64 | tr -d '\r\n' | base64 --decode > docs/public/Picture/avatar.webp
          test -s docs/public/Picture/avatar.webp
          bytes="$(stat -c '%s' docs/public/Picture/avatar.webp)"
          echo "Homepage hero bytes: ${bytes}"
          test "${bytes}" -eq 23024
          echo "5ff0b0ab381f3b380f101f7a921109ad6acf2c377734281ec816f4dfef1f36b3  docs/public/Picture/avatar.webp" | sha256sum --check --strict

          ffmpeg -hide_banner -loglevel error -y \
            -i docs/public/Picture/avatar.webp \
            -vf "format=yuvj420p" \
            -q:v 3 \
            docs/public/Picture/avatar.jpg
          test -s docs/public/Picture/avatar.jpg

          ffmpeg -hide_banner -loglevel error -y \
            -i docs/public/Picture/avatar.webp \
            -vf "scale=512:512:flags=lanczos,format=rgba" \
            -frames:v 1 \
            avatar.png
          test -s avatar.png
          file avatar.png | grep -q 'PNG image data'

      - name: Sync homepage hero files back to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/public/Picture/avatar.webp docs/public/Picture/avatar.jpg avatar.png
          if git diff --cached --quiet; then
            echo "Homepage hero files and root avatar already match the deployment source."
          else
            git commit -m "chore: sync homepage hero and root avatar"
            git push origin HEAD:main
          fi

      - name: Repair auditable dependency vulnerabilities
        run: |
          npm audit fix --package-lock-only
          npm ci

      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=moderate

      - name: Generate animated WebP logo
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -i docs/public/Picture/logo.gif \
            -vf "scale=128:128:force_original_aspect_ratio=decrease:flags=lanczos,pad=128:128:(ow-iw)/2:(oh-ih)/2:color=0x00000000,format=rgba" \
            -c:v libwebp_anim \
            -lossless 0 \
            -q:v 72 \
            -compression_level 6 \
            -loop 0 \
            -an \
            docs/public/Picture/logo.webp

          grep -a -q 'ANIM' docs/public/Picture/logo.webp
          frames="$(grep -a -o 'ANMF' docs/public/Picture/logo.webp | wc -l | tr -d ' ')"
          bytes="$(stat -c '%s' docs/public/Picture/logo.webp)"

          echo "Animated WebP frames: ${frames}"
          echo "Animated WebP bytes: ${bytes}"
          test "${frames}" -gt 1
          test "${bytes}" -lt 524288

      - name: Build and audit VitePress site
        run: npm run docs:build

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '4.118.0'
          command: >-
            pages deploy docs/.vitepress/dist
            --project-name=mizuki-bot-docs
            --branch=${{ github.ref_name }}
            --commit-dirty=true

      - name: Submit changed URLs to IndexNow
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          INDEXNOW_BEFORE_SHA: ${{ github.event.before }}
          INDEXNOW_AFTER_SHA: ${{ github.sha }}
        run: npm run seo:indexnow
